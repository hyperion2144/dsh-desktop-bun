name: Check

# dsh-desktop-bun 的推送/PR 检查门禁（#7/#18）：跑 typecheck + test（壳 + 插件）与 Windows 兜底测试面，不打包。
#
# 触发策略（方案 A，与 build.yml 分工）：
#   - 本文件：push(main) 与 pull_request —— 每轮迭代的快速反馈
#   - build.yml：workflow_dispatch / tag push / 每日 schedule（#8）—— 完整构建 + 断言 + 冒烟 + 上传
# main 打包链的持续验证：每日 schedule 兜底（#8，UTC 18:30）+ 手动 dispatch。
on:
  push:
    branches: [main]
    paths:
      - 'desktop-electrobun/**'
      - 'resources/**'
      - 'desktop-plugin/**'
      - 'plugins/**'
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/check.yml'
  pull_request:
    paths:
      - 'desktop-electrobun/**'
      - 'resources/**'
      - 'desktop-plugin/**'
      - 'plugins/**'
      - 'mobile/**'
      - 'scripts/**'
      - '.github/workflows/build.yml'
      - '.github/workflows/check.yml'

permissions:
  contents: read

jobs:
  check:
    name: 检查（壳 + 插件：typecheck + test）
    runs-on: ubuntu-latest
    timeout-minutes: 20 # 检查链正常 ~5 分钟
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      # Bun 版本与 build.yml 对齐（Electrobun 2.0.2 自带 Bun 1.4.0）。低版本缺
      # `Bun.Terminal` / `Bun.spawn({terminal})` 等能力，node-pty 垫片会直接失效。
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # 单测输入准备与 build.yml 的检查段一致：build:native 在 macOS 产出通知桥
      # dylib（「dylib 就位」那条单测的输入），非 macOS 自行跳过——与现状 CI 的
      # Linux 侧行为相同。不装运行时树 / prepare:bundle：需要真运行时的黑盒缝
      # 单测会自行跳过（DSH_SHELL_TEST_RUNTIME 未设）。
      - name: 依赖（bun install）
        working-directory: desktop-electrobun
        run: bun install --frozen-lockfile

      - name: 准备（原生通知桥）
        working-directory: desktop-electrobun
        run: bun run build:native

      - name: 类型检查
        working-directory: desktop-electrobun
        run: bun run typecheck

      - name: 单元测试
        working-directory: desktop-electrobun
        run: bun test

      # 插件门禁（#18）：test:client 纯函数断言 + 全量 tsc（strict，零豁免）。
      # build:client 是构建产物产出、不是门禁（v2 拍板），不进 check。
      - name: 插件依赖（bun install）
        working-directory: desktop-plugin
        run: bun install --frozen-lockfile

      - name: 插件类型检查
        working-directory: desktop-plugin
        run: bun run typecheck

      - name: 插件测试
        working-directory: desktop-plugin
        run: bun run test:client

      # 移动端快检（#33）：shell-web 与 dsh-mobile-access 都是无依赖的纯 node --test
      # 套件（19 + 71 例），不装依赖直接跑；node 22 由 setup-node 固定
      # （dsh-mobile-access 的 engines 门槛 >=22）。旧仓 mobile 测试从未进 CI，这里是补齐。
      - name: Setup Node.js 22（移动端快检）
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 移动端共享模块测试（shell-web）
        working-directory: mobile/shell-web
        run: npm test

      - name: 手机访问服务测试（dsh-mobile-access）
        working-directory: plugins/dsh-mobile-access
        run: npm test

  # Windows 可跑性兜底（#18 拍板新增）：check 覆盖 Windows 特殊路径。
  # 只跑测试面（壳 bun test + 插件 test:client），typecheck 与原生准备单跑
  # ubuntu。POSIX-only 用例已按平台 skip（#18 留档清单）；本 job 保持启用、
  # 失败即红——不为绿禁用，也不对步骤放水（无 continue-on-error）；若出现
  # 大面积环境性失败，按 #18 风险条款带清单回维护者定夺。
  check-windows:
    name: 检查（Windows 兜底）
    runs-on: windows-latest
    timeout-minutes: 20 # Windows 兜底检查正常 ~10 分钟
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: 壳单测
        working-directory: desktop-electrobun
        run: |
          bun install --frozen-lockfile
          bun test

      - name: 插件测试
        working-directory: desktop-plugin
        run: |
          bun install --frozen-lockfile
          bun run test:client
