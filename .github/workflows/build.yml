name: Build

# dsh-desktop-bun（Electrobun + CEF + Bun 桌面壳）的三平台构建与产物断言。
#
# 为什么必须有产物断言这一步：Electrobun 的 `renderer: 'cef'` 在**没打 CEF** 时会静默回落
# 系统 webview（mac `nativeWrapper.mm:8359` / win `nativeWrapper.cpp:8944` / linux
# `nativeWrapper.cpp:591`），外观上完全看不出——但那就等于把 #200 那族 JavaScriptCore 崩溃
# 原样带回来。所以打包后立刻用 `scripts/assert-artifact.mjs` 翻产物（见该脚本注释）。
# #84 起该断言的渲染器载荷口径平台条件化：mac/linux 仍要求 CEF 载荷，win 反向核验（出现 CEF 即策略回归/包体回胖）。
#
# 未验证假设（分支推送前 CI 跑不起来，首次跑要盯这几处）：
#   1. hutch CLI 在 Windows/Linux runner 上的安装与 PATH（这里用 Git Bash 跑官方 install.sh）；
#   2. Windows/Linux 自带 tar 是否支持 `--zstd`（assert 脚本已退到 `-tf`，但没有 zstd 时
#      tar 可能仍读不了 zst）；
#   3. Windows 产物「无 CEF」反向核验口径与 Linux 产物里 CEF 标志名、payload 布局（按 Electrobun 源码推断，未实机验证）。
on:
  workflow_dispatch:
    # mode=shots-only：只跑「安装器 UI 真机出图」（stub 载荷，分钟级），三平台矩阵全跳过——
    # #103 样式验收快车道（GitHub 只注册默认分支上的 workflow，PR 合入前
    # installer-ui.yml 无法直接 dispatch，故由本文件转发；合入后可直接 dispatch 它）
    inputs:
      mode:
        description: 'shots-only = 只出安装器 UI 截图，跳过全量构建'
        required: false
        default: ''
        type: string
  push:
    tags:
      # 全部 tag 都触发（AC 原文「tag push 触发全量流水线」，未限定前缀；'**' 连含斜杠的 tag 名也匹配）
      - '**'
  schedule:
    # 每日全量兜底（#8）：UTC 18:30 = 北京 02:30，避开迭代高峰；偏移整点躲开调度拥堵。
    # schedule 事件只在默认分支触发（官方语义），无需 ref 守卫；与 dispatch/tag 共用同一条流水线。
    - cron: '30 18 * * *'
#
# 触发策略（#7 方案 A + #8 定时兜底）：push(main) 与 pull_request 一律只跑检查（见 check.yml）——
# 每次全量约 40 runner-分钟（三平台打包 + NSIS + 冒烟），不该发生在每一轮
# 迭代上。完整构建只留给手动 dispatch、tag push 与每日定时兜底（schedule，见 on:）；
# main 打包链由兜底持续验证，hutch/NSIS/runner 镜像漂移最迟次日暴露。
# 注：这里只做「构建 + 断言 + 存 CI 产物」。真正的发布（把安装包与 `<platformPrefix>-update.json` +
# `<platformPrefix>-*.app.tar.zst` 作为 Release 资产传上去）还没接——自动更新的清单就是靠这两个资产名稳定地
# 指到最新一版，缺了它们更新永远不可用。等允许打 tag 时再加一个 release job。

permissions:
  contents: read

jobs:
  build:
    name: 构建 + 产物断言（${{ matrix.label }}）
    # mode=shots-only 时只跑安装器 UI 出图（转发 job），全量构建跳过
    if: inputs.mode != 'shots-only'
    runs-on: ${{ matrix.os }}
    # hutch 首次构建要下载 cottontail/Electrobun/CEF/bun 四件套，下载器无超时（run 38493719636 实证挂 85 分钟）；
    # 全量正常 ~15 分钟，40 分钟兜底防挂死占 runner
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        include:
          # Electrobun 官方只发 macOS arm64（无 x64）、Windows x64/arm64、Linux x64/arm64。
          # 规格 #220 的平台范围就是这三个（Windows ARM64 与 macOS x64 在 Out of Scope）。
          - os: macos-14
            label: macOS arm64
          - os: windows-latest
            label: Windows x64
          - os: ubuntu-latest
            label: Linux x64
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive


      # macos-14 runner 自带 Android SDK（~9GB）等用不到的大件，而 CEF 构建 + 压缩 + DMG 要写出
      # 2GB 以上——首次跑就撞过 `hdiutil: create failed - No space left on device`。
      - name: 腾磁盘（macOS）
        if: runner.os == 'macOS'
        shell: bash
        run: |
          df -h /
          sudo rm -rf /Users/runner/Library/Android/sdk /Users/runner/.rustup /Users/runner/.cargo /usr/local/share/dotnet 2>/dev/null || true
          df -h /
      # Bun 版本要跟 Electrobun 2.0.2 自带的那个对齐（Bun 1.4.0）。低版本缺
      # `Bun.Terminal` / `Bun.spawn({terminal})` 等能力，node-pty 垫片会直接失效。
      - name: Setup Bun 1.4.0
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      # hutch 官方 install.sh 的 uname 分支只认 Darwin/Linux（Windows 的 Git Bash 会报
      # unsupported platform），所以 Windows 走官方 install.ps1；两条路都把 bin 目录
      # 写进 GITHUB_PATH，后面的步骤才看得见 `hutch`。
      - name: 安装 hutch（Electrobun CLI，非 Windows）
        if: runner.os != 'Windows'
        shell: bash
        run: |
          curl -fsSL https://hutch.blackboard.sh/hutch/install.sh | sh
          echo "$HOME/.hutch/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.hutch/bin:$PATH"
          hutch --version

      - name: 安装 hutch（Electrobun CLI，Windows）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          irm https://hutch.blackboard.sh/hutch/install.ps1 -OutFile "$env:TEMP\hutch-install.ps1"
          & "$env:TEMP\hutch-install.ps1" -NoModifyPath
          $bin = Join-Path $HOME '.hutch\bin'
          Add-Content -Path $env:GITHUB_PATH -Value $bin
          & (Join-Path $bin 'hutch.exe') --version

      - name: 依赖（bun install）
        working-directory: desktop-electrobun
        run: bun install --frozen-lockfile

      # 原生通知桥（native/libdsh-notify.dylib）也是单测的输入之一（「dylib 就位」那条），
      # 所以先准备好再跑测试；非 macOS 上 build:native 自己跳过。
      - name: 准备（原生通知桥 + 包内资源）
        working-directory: desktop-electrobun
        run: |
          bun run build:native
          bun run prepare:bundle

      - name: 类型检查
        working-directory: desktop-electrobun
        run: bun run typecheck

      # 默认不设 DSH_SHELL_TEST_RUNTIME ⇒ 需要真 dsh 运行时树的黑盒缝 ① 会自行跳过，
      # 其余（策略、路由、台账、设置、guest、更新、通知……）全跑。
      - name: 单元测试
        working-directory: desktop-electrobun
        run: bun test

      - name: 打包（Electrobun）
        working-directory: desktop-electrobun
        shell: bash
        run: |
          # hdiutil 在 runner 上偶发 Resource busy（实测 run 38294201295）：重试三次
          for attempt in 1 2 3; do
            hutch electrobun build --env=stable && break
            echo "打包第 $attempt 次失败，重试…"
            [ "$attempt" = "3" ] && exit 1
            sleep 30
          done
          # 封装签名只在 macOS 有意义（通知授权要一份绑了 Info.plist 的签名）；
          # 脚本自身在非 macOS 会跳过，但 Windows/Linux 产物里没有 .app，这里就不调它。
          if [ "$RUNNER_OS" = "macOS" ]; then
            bun run sign:app
          fi

      - name: Windows 安装器（NSIS）
        if: runner.os == 'Windows'
        working-directory: desktop-electrobun
        shell: pwsh
        run: |
          if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }
          # 品牌图不入库（.gitignore）：安装器构建前先按 resources/app-icon.ico 生成（#92 的生成器 / #91 消费）
          bun run prepare:installer-assets
          pwsh -File scripts/build-window-frame.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }   # DLL 编译失败必须拦住构建（C2374 事故：曾静默打出无 DLL 的安装器）
          bun run build:installer

      - name: 产物断言（渲染器运行时 + version.json）
        working-directory: desktop-electrobun
        run: bun run assert:artifact

      # Windows 交付物 = 可直接执行的安装程序（A2）+ 可选安装目录（A4）。Electrobun 自身只出
      # 构建目录 + payload 归档，这里用 NSIS 包一层：每用户安装、目录选择页、开始菜单快捷方式、
      # 卸载器；图标用与 win.icon 同源的 resources/app-icon.ico。GitHub windows-latest 镜像自带
      # NSIS，万一镜像瘦身没了再 choco 兜底。
      - name: 静默安装（NSIS /S，装到固定目录）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $setup = Get-ChildItem desktop-electrobun\artifacts -Recurse -Filter *-setup.exe | Select-Object -First 1
          if ($null -eq $setup) { throw '找不到 setup.exe' }
          $env:ELECTROBUN_INSTALLER_UI_AUTOCLOSE = '1'
          Start-Process -FilePath $setup.FullName -ArgumentList '/S','/D=C:\dsh-smoke' -Wait
          if (-not (Test-Path 'C:\dsh-smoke')) { throw '静默安装后没有安装目录' }
          Get-ChildItem C:\dsh-smoke | Select-Object -First 12 | ForEach-Object { $_.Name }
          # 诊断：装出来的树里 payload 归档/版本文件在哪（launcher 报 No metadata marker 时用它定位）
          Get-ChildItem C:\dsh-smoke -Recurse -Include *.tar.zst,version.json,build.json -ErrorAction SilentlyContinue | Select-Object -First 20 | ForEach-Object { Write-Host ("{0}  {1}" -f $_.FullName, $_.Length) }
          # 诊断 2：装出来的树全貌（深度 3），看 launcher 旁边的 Resources 里有没有 main.js/build.json
          Get-ChildItem C:\dsh-smoke -Recurse -Depth 3 -ErrorAction SilentlyContinue | Select-Object -First 60 | ForEach-Object { Write-Host $_.FullName }
      - name: 无窗口启动 + SHELL-READY 断言
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # Windows 版式：launcher.exe 与 metadata.json 同层（应用根），bin\ 下那个不是自解压入口
          $appRoot = Get-ChildItem C:\dsh-smoke -Directory | Select-Object -First 1
          $app = Get-ChildItem $appRoot.FullName -Filter launcher.exe | Select-Object -First 1
          if ($null -eq $app) { $app = Get-ChildItem C:\dsh-smoke -Recurse -Filter launcher.exe | Select-Object -First 1 }
          if ($null -eq $app) { throw '安装树里找不到 launcher.exe' }
          # 内置树随包断言：Windows 是两段式（安装位 = launcher + payload 归档，app\dsh
          # 要等首次启动自解压才物化），所以放到 SHELL-READY 之后断言（见下方）。
          $smokeHome = Join-Path $env:RUNNER_TEMP 'dsh-smoke-home'
          $log = Join-Path $env:RUNNER_TEMP 'smoke-out.log'
          $env:DSH_HOME = $smokeHome
          $env:DSH_SHELL_PROFILE_MODE = 'fresh'
          $env:DSH_SHELL_NO_WINDOW = '1'
          $env:DSH_SHELL_PAGE_PORT = '6451'
          $env:DSH_DESKTOP_PORT = '6452'
          $env:DSH_MOBILE_LANE_PORT = '6453'
          $env:DSH_DESKTOP_AUTO_QUIT = '20000'
          $env:DSH_DESKTOP_NO_SINGLETON = '1'
          # launcher 自己知道怎么引导自己的载荷（macOS 实测裸跑即可），不用替它拼 main.js 参数
          # 提速：runner 的 Defender 实时扫描会把 31k 文件的解压拖到分钟级
          $elevated = [Security.Principal.WindowsPrincipal]::new([Security.Principal.WindowsIdentity]::GetCurrent()).IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          Write-Host ("冒烟：elevated={0}" -f $elevated)
          if ($elevated) {
            Set-MpPreference -DisableRealtimeMonitoring $true -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath 'C:\dsh-smoke' -ErrorAction SilentlyContinue
            Add-MpPreference -ExclusionPath (Join-Path $env:LOCALAPPDATA 'com.hyperion.dsh-desktop-bun') -ErrorAction SilentlyContinue
            Write-Host ("冒烟：Defender realtime={0}" -f (Get-MpPreference).DisableRealtimeMonitoring)
          }
          # 不走 launcher 的 Windows 自解压（上游 extractor 在本 payload 上会把 .tar.spool 写死，
          # 多轮 CI 实测：tar.partial 冻结、launcher 活着但不前进）。冒烟改为「装完后直接用
          # 包内 bun 跑 Resources/main.js」，与 mac launcher 的引导语义一致，覆盖安装器 + 载荷 + 服务面。
          $payloadRes = Join-Path $appRoot.FullName 'Resources'
          # bun 可执行文件在载荷 bin\ 下（mac 版式 Contents/MacOS/bun 的 Windows 对应物）
          $bunExe = Get-ChildItem $appRoot.FullName -Recurse -Filter bun.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\.installer' } | Select-Object -First 1
          if ($null -eq $bunExe) {
            Get-ChildItem $appRoot.FullName -Directory -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 24 | ForEach-Object { Write-Host ("应用树目录：{0}" -f $_.FullName) }
            Get-ChildItem (Join-Path $payloadRes 'app') -Recurse -Depth 2 -ErrorAction SilentlyContinue | Select-Object -First 24 | ForEach-Object { Write-Host ("app 内：{0}" -f $_.FullName.Substring($payloadRes.Length)) }
            throw "载荷里找不到 bun.exe"
          }
          $mainJs = Join-Path $payloadRes 'main.js'
          if (-not (Test-Path $mainJs)) { throw ("安装树里没有 main.js：{0}" -f $mainJs) }
          Write-Host ("冒烟：bun = {0}" -f $bunExe.FullName)
          $log2 = Join-Path $env:RUNNER_TEMP 'smoke-payload.log'
          Write-Host ("冒烟：直接拉起包内载荷：{0} {1}" -f $bunExe, $mainJs)
          Start-Process -FilePath $bunExe -ArgumentList "`"$mainJs`"" -WorkingDirectory $payloadRes -RedirectStandardOutput $log2 -RedirectStandardError ($log2 + '.err')
          $ready = $false
          foreach ($i in 1..300) {
            Start-Sleep -Seconds 2
            $text = Get-Content $log2 -Raw -ErrorAction SilentlyContinue
            if ($text -and $text -match 'SHELL-READY') { $ready = $true; $log = $log2; break }
            if ($i % 15 -eq 0) { Write-Host ("冒烟：等待 SHELL-READY {0}s" -f ($i * 2)) }
          }
          if (-not $ready) {
            Write-Host '--- stdout ---'; Get-Content $log2 -ErrorAction SilentlyContinue | Select-Object -First 30
            Write-Host '--- stderr ---'; Get-Content ($log2 + '.err') -ErrorAction SilentlyContinue | Select-Object -First 30
            throw '600 秒内未拿到 SHELL-READY（直接拉起包内载荷）'
          }
          (Get-Content $log -Raw | Select-String -Pattern 'SHELL-READY.*').Matches.Value | Write-Host
          # 首启自解压完成后，内置 dsh 树必须已物化（goal 第 1 条的 Windows 半边）
          $roots = @('C:\dsh-smoke')
          $dshTree = $null
          foreach ($root in $roots) {
            if (-not (Test-Path $root)) { continue }
            $dshTree = Get-ChildItem $root -Recurse -Filter bin.js -ErrorAction SilentlyContinue | Where-Object { $_.FullName -like '*app\dsh\node_modules\@deepseek-ai\dsh\lib*' } | Select-Object -First 1
            if ($null -ne $dshTree) { break }
          }
          if ($null -eq $dshTree) { throw '启动后没有物化内置 dsh 运行时树（app\dsh）' }
          Write-Host "内置 dsh 树：$($dshTree.FullName)"
          # 等 AUTO_QUIT 收尾（再给 60 秒），然后确认没有残留的 bun/launcher 服务进程
          Start-Sleep -Seconds 60
          $left = Get-Process -Name 'bun','launcher' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like 'C:\dsh-smoke*' }
          if ($left) { $left | ForEach-Object { Stop-Process -Id $_.Id -Force }; throw 'AUTO_QUIT 后仍有残留服务进程' }
          Write-Host 'Windows 冒烟通过：静默安装 + 无窗口启动（SHELL-READY）+ 自动退出无残留'

      # #109：win 打包态 DevTools CDP 冒烟——dev_tools 开/关两态各起一次窗口态壳，断言
      # WebView2 远程调试口（默认 9333）在开关开时可探活、开关关时连接拒绝。窗口模式是必须的：
      # --no-window 不建 WebView2 环境，调试口永远不会开；这里复用上一段静默安装的产物与 DSH_HOME。
      #
      # 提权 runner 的补偿（CI-only）：GitHub Windows runner 以管理员运行；WebView2 150+ 对提权
      # 宿主按设计忽略 WEBVIEW2_* 环境变量（WebView2Feedback #5640），壳内 SetEnvironmentVariableA
      # 写的 --remote-debugging-port 不会生效。ON 态写 machine-wide HKLM 策略
      # SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments 的 "*" 值补上参数，
      # OFF 态删除；这只证明 CDP 端点在 runner 上可用，不等价于覆盖壳的 env 写入路径。
      - name: DevTools CDP 冒烟（dev_tools 开/关两态）
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # 让 curl 的非零退出码走 $LASTEXITCODE，而不是被 $ErrorActionPreference 变成异常
          $PSNativeCommandUseErrorActionPreference = $false

          $cdpUrl = 'http://127.0.0.1:9333/json/version'
          $smokeHome = Join-Path $env:RUNNER_TEMP 'dsh-smoke-home'
          $settingsPath = Join-Path $smokeHome 'desktop-settings.json'
          $webView2PolicyKey = 'SOFTWARE\Policies\Microsoft\Edge\WebView2\AdditionalBrowserArguments'

          # 复用上面无窗口冒烟的安装树（App\Resources\main.js + 包内 bun.exe）。
          $appRoot = Get-ChildItem 'C:\dsh-smoke' -Directory | Where-Object { $_.Name -eq 'App' -and (Test-Path (Join-Path $_.FullName 'Resources\main.js')) } | Select-Object -First 1
          if ($null -eq $appRoot) { $appRoot = Get-ChildItem 'C:\dsh-smoke' -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'Resources\main.js') } | Select-Object -First 1 }
          if ($null -eq $appRoot) { $appRoot = Get-ChildItem 'C:\dsh-smoke' -Directory | Select-Object -First 1 }
          if ($null -eq $appRoot) { throw '安装树里找不到应用根目录' }
          $payloadRes = Join-Path $appRoot.FullName 'Resources'
          $mainJs = Join-Path $payloadRes 'main.js'
          if (-not (Test-Path $mainJs)) { throw "安装树里没有 main.js：$mainJs" }
          $bunExe = Get-ChildItem $appRoot.FullName -Recurse -Filter bun.exe -ErrorAction SilentlyContinue | Where-Object { $_.FullName -notmatch '\.installer' } | Select-Object -First 1
          if ($null -eq $bunExe) { throw '载荷里找不到 bun.exe' }
          Write-Host ("CDP 冒烟：bun = {0}" -f $bunExe.FullName)

          function Set-DevTools([bool]$enabled) {
            if (-not (Test-Path $smokeHome)) { New-Item -ItemType Directory -Path $smokeHome -Force | Out-Null }
            $settings = @{}
            if (Test-Path $settingsPath) {
              try { $settings = Get-Content -Raw -Path $settingsPath | ConvertFrom-Json -AsHashtable } catch { $settings = @{} }
            }
            if ($null -eq $settings) { $settings = @{} }
            $settings['dev_tools'] = $enabled
            $json = $settings | ConvertTo-Json -Depth 20
            [System.IO.File]::WriteAllText($settingsPath, $json + "`n", [System.Text.UTF8Encoding]::new($false))
            Write-Host ("CDP 冒烟：dev_tools={0}（{1}）" -f $enabled, $settingsPath)
          }

          function Set-WebView2CdpPolicy([bool]$enabled) {
            $hklm = [Microsoft.Win32.Registry]::LocalMachine
            if ($enabled) {
              $key = $hklm.CreateSubKey($webView2PolicyKey)
              if ($null -eq $key) { throw 'CDP 冒烟：创建 HKLM WebView2 策略键失败' }
              try {
                $key.SetValue('*', '--remote-debugging-port=9333', [Microsoft.Win32.RegistryValueKind]::String)
                $key.SetValue('', '--remote-debugging-port=9333', [Microsoft.Win32.RegistryValueKind]::String)
              } finally {
                $key.Close()
              }
              Write-Host 'CDP 冒烟：已写 HKLM WebView2 AdditionalBrowserArguments（* + 默认值）'
            } elseif (Test-Path "HKLM:\$webView2PolicyKey") {
              $hklm.DeleteSubKeyTree($webView2PolicyKey, $false)
              Write-Host 'CDP 冒烟：已清理 HKLM WebView2 策略'
            }
          }

          function Assert-WebView2PolicyCleared {
            if (Test-Path "HKLM:\$webView2PolicyKey") { throw 'CDP 冒烟：HKLM WebView2 策略清理失败（9333 可能被全局打开）' }
          }

          function Get-CdpProbe {
            $raw = & curl.exe -s --noproxy '*' --connect-timeout 1 -o NUL -w '%{http_code}' --max-time 3 $cdpUrl 2>$null
            $exit = $LASTEXITCODE
            return [pscustomobject]@{ ExitCode = $exit; HttpCode = ("$raw").Trim() }
          }

          function Start-SmokeApp([string]$tag) {
            $stdout = Join-Path $env:RUNNER_TEMP "cdp-smoke-$tag.log"
            $stderr = "$stdout.err"
            Remove-Item -Force -ErrorAction SilentlyContinue $stdout, $stderr
            $env:DSH_HOME = $smokeHome
            $env:DSH_SHELL_PROFILE_MODE = 'existing'
            $env:DSH_SHELL_DEVTOOLS_PORT = '9333'
            $env:DSH_SHELL_PAGE_PORT = '6451'
            $env:DSH_DESKTOP_PORT = '6452'
            $env:DSH_MOBILE_LANE_PORT = '6453'
            $env:DSH_DESKTOP_AUTO_QUIT = '30000'
            $env:DSH_DESKTOP_NO_SINGLETON = '1'
            Remove-Item Env:DSH_SHELL_NO_WINDOW -ErrorAction SilentlyContinue
            $proc = Start-Process -FilePath $bunExe.FullName -ArgumentList "`"$mainJs`"" -WorkingDirectory $payloadRes -RedirectStandardOutput $stdout -RedirectStandardError $stderr -PassThru
            Write-Host ("CDP 冒烟[{0}]：启动窗口态壳 pid={1}" -f $tag, $proc.Id)
            return [pscustomobject]@{ Proc = $proc; Stdout = $stdout; Stderr = $stderr; Tag = $tag }
          }

          function Wait-ShellReady($app, [int]$seconds = 600) {
            $deadline = (Get-Date).AddSeconds($seconds)
            while ((Get-Date) -lt $deadline) {
              if ($app.Proc.HasExited) { return $false }
              if (Test-Path $app.Stdout) {
                if (Select-String -Path $app.Stdout -Pattern 'SHELL-READY' -SimpleMatch -Quiet -ErrorAction SilentlyContinue) { return $true }
              }
              Start-Sleep -Milliseconds 500
            }
            return $false
          }

          function Show-AppLogs($app) {
            Write-Host ("--- {0} stdout（末 80 行）---" -f $app.Tag)
            Get-Content $app.Stdout -Tail 80 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
            Write-Host ("--- {0} stderr（末 80 行）---" -f $app.Tag)
            Get-Content $app.Stderr -Tail 80 -ErrorAction SilentlyContinue | ForEach-Object { Write-Host $_ }
          }

          function Stop-SmokeApp($app) {
            if (-not $app.Proc.HasExited) {
              if (-not $app.Proc.WaitForExit(60000)) {
                Write-Warning "CDP 冒烟[$($app.Tag)]：自动退出超时，终止进程树"
                & taskkill.exe /PID $app.Proc.Id /T /F 2>$null | Out-Null
                $app.Proc.WaitForExit(20000) | Out-Null
              }
            }
            # 给 WebView2 子进程 5s 优雅退出；再清掉仍带 9333 调试参数的浏览器进程。
            # 浏览器进程可能在关掉调试口后仍存活，被下一阶段复用并把 9333 重新打开。
            Start-Sleep -Seconds 5
            $victims = @(Get-CimInstance Win32_Process -Filter "Name = 'msedgewebview2.exe'" -ErrorAction SilentlyContinue |
              Where-Object { $_.CommandLine -and $_.CommandLine -like '*--remote-debugging-port=9333*' })
            foreach ($victim in $victims) {
              Write-Warning ("CDP 冒烟[{0}]：清理带 9333 参数的 WebView2 进程 (pid={1})" -f $app.Tag, $victim.ProcessId)
              Stop-Process -Id $victim.ProcessId -Force -ErrorAction SilentlyContinue
            }
            # 等 9333 真正没有监听（10s）；仍有监听就按 PID 清掉。
            $closed = $false
            foreach ($i in 1..10) {
              $listeners = @(Get-NetTCPConnection -LocalPort 9333 -State Listen -ErrorAction SilentlyContinue)
              if ($listeners.Count -eq 0) { $closed = $true; break }
              foreach ($listener in $listeners) {
                $owner = Get-Process -Id $listener.OwningProcess -ErrorAction SilentlyContinue
                if ($owner) {
                  Write-Warning ("CDP 冒烟[{0}]：9333 被 {1} (pid={2}) 占用，强制结束" -f $app.Tag, $owner.ProcessName, $owner.Id)
                  Stop-Process -Id $owner.Id -Force -ErrorAction SilentlyContinue
                }
              }
              Start-Sleep -Seconds 1
            }
            if (-not $closed) { Write-Warning "CDP 冒烟[$($app.Tag)]：退出后 9333 仍有监听（可能残留 WebView2 子进程）" }
            $left = Get-Process -Name 'bun','launcher' -ErrorAction SilentlyContinue | Where-Object { $_.Path -like 'C:\dsh-smoke*' }
            if ($left) {
              $left | ForEach-Object { Stop-Process -Id $_.Id -Force -ErrorAction SilentlyContinue }
              Write-Warning "CDP 冒烟[$($app.Tag)]：退出后仍有残留服务进程，已强制结束"
            }
          }

          function Invoke-Phase([string]$tag, [bool]$enabled, [scriptblock]$assert) {
            Write-Host ("==== DevTools CDP 冒烟：dev_tools={0} ====" -f $enabled)
            $app = $null
            try {
              Set-WebView2CdpPolicy $enabled
              Set-DevTools $enabled
              $app = Start-SmokeApp $tag
              if (-not (Wait-ShellReady $app)) {
                Show-AppLogs $app
                throw "CDP 冒烟[$tag]：600 秒内未拿到 SHELL-READY"
              }
              $readyLine = (Get-Content $app.Stdout -Raw | Select-String -Pattern 'SHELL-READY.*').Matches.Value
              Write-Host $readyLine
              & $assert $app
              Write-Host ("CDP 冒烟[{0}]：通过" -f $tag)
            } catch {
              Show-AppLogs $app
              throw
            } finally {
              if ($null -ne $app) { Stop-SmokeApp $app }
              Set-WebView2CdpPolicy $false
            }
          }
          try {
            Set-WebView2CdpPolicy $false

          Invoke-Phase 'on' $true {
            param($app)
            $deadline = (Get-Date).AddSeconds(10)
            while ((Get-Date) -lt $deadline) {
              $probe = Get-CdpProbe
              if ($probe.ExitCode -eq 0 -and $probe.HttpCode -eq '200') { break }
              Start-Sleep -Seconds 1
            }
            $probe = Get-CdpProbe
            if ($probe.ExitCode -ne 0 -or $probe.HttpCode -ne '200') {
              throw "CDP 冒烟[on]：/json/version 不是 200（curl exit=$($probe.ExitCode)，http=$($probe.HttpCode)）"
            }
            $version = & curl.exe -s --noproxy '*' --max-time 5 $cdpUrl
            if ($LASTEXITCODE -ne 0) { throw "CDP 冒烟[on]：读取 /json/version 失败（curl exit=$LASTEXITCODE）" }
            $body = ($version -join "`n")
            Write-Host $body
            if ($body -notmatch '"webSocketDebuggerUrl"') { throw 'CDP 冒烟[on]：/json/version 缺少 webSocketDebuggerUrl' }
            if (-not (Select-String -Path $app.Stdout -Pattern 'WebView2.*127\.0\.0\.1:9333' -Quiet -ErrorAction SilentlyContinue)) {
              throw 'CDP 冒烟[on]：壳日志里没有「WebView2 远程调试口 127.0.0.1:9333」——设置没有驱动 env 写入'
            }
          }

          Invoke-Phase 'off' $false {
            param($app)
            if (Select-String -Path $app.Stdout -Pattern 'WebView2.*127\.0\.0\.1:9333' -Quiet -ErrorAction SilentlyContinue) {
              throw 'CDP 冒烟[off]：dev_tools=false 但壳日志仍打印 WebView2 调试口'
            }
            $deadline = (Get-Date).AddSeconds(20)
            $probes = 0
            while ((Get-Date) -lt $deadline) {
              if ($app.Proc.HasExited) { throw 'CDP 冒烟[off]：探测期间壳已退出' }
              $listeners = @(Get-NetTCPConnection -LocalPort 9333 -State Listen -ErrorAction SilentlyContinue)
              if ($listeners.Count -gt 0) {
                $pids = ($listeners | ForEach-Object { $_.OwningProcess }) -join ','
                throw "CDP 冒烟[off]：dev_tools=false 时 9333 有监听进程（pid=$pids）"
              }
              $probes += 1
              Start-Sleep -Seconds 1
            }
            if ($probes -lt 3) { throw "CDP 冒烟[off]：有效探测次数不足（$probes）" }
            Write-Host "CDP 冒烟[off]：9333 无监听（$probes 次探测）"
          }
          } finally {
            Set-WebView2CdpPolicy $false
          }
          Assert-WebView2PolicyCleared

          Write-Host 'DevTools CDP 冒烟通过：dev_tools 开 = WebView2 调试口可探活（提权 runner 由 HKLM 策略补偿）；dev_tools 关 = 连接拒绝'

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: dsh-desktop-shell-${{ matrix.label }}
          # 只上传「交给人的交付物」：Windows = NSIS 安装程序，macOS = DMG，Linux = tar.gz。
          # 更新链资产（*-update.json / *.app.tar.zst / Setup.tar.zst）留给将来的 release job，
          # 不进 CI artifact——GitHub 会把 artifact 包成一层 zip，混进更新包就变成上 GB 的压缩包。
          path: |
            desktop-electrobun/artifacts/*-setup.exe
            desktop-electrobun/artifacts/*.dmg
            desktop-electrobun/artifacts/linux-*.tar.gz
          if-no-files-found: error

  # #103 安装器 UI 真机出图入口：mode=shots-only 时转发到同提交的 installer-ui.yml
  # （stub 载荷，分钟级，不打真实桌面、不跑产品测试）
  installer-ui-shots:
    name: 安装器 UI 真机出图（stub 载荷）
    if: inputs.mode == 'shots-only'
    uses: ./.github/workflows/installer-ui.yml
