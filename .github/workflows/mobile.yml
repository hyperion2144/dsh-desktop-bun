
name: Mobile Build

# 移动端出包（#33）：Android APK（debug 签名，可直接安装）+ iOS IPA（未签名，
# 供 AltStore 等免费签名工具侧载）。鸿蒙不出包：需 DevEco/华为签名，
# 本地构建见 mobile/harmony/README.md。
#
# 触发策略与 build.yml 对齐（#7 方案 A 的移动端延伸）：
#   - tag push '**'：全部 tag 都触发——桌面与手机同一 tag 一起出包，
#     避免旧仓 v* vs 全 tag 的不一致（「tag 一推桌面出了手机没出」）。
#   - workflow_dispatch：手动出包。
# 不发 Release：build.yml 口径「真正的发布还没接」，这里同样只存 CI artifact，
# 等发布链（release job）落地时再一起接 softprops/action-gh-release。
on:
  workflow_dispatch:
  push:
    tags:
      # 与 build.yml 同口径：'**' 连含斜杠的 tag 名也匹配。
      - '**'

permissions:
  contents: read

jobs:
  build-mobile:
    name: 移动端出包（${{ matrix.target }}）
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: android
          - os: macos-14
            target: ios
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 与 build.yml 对齐带 submodules：expo 出包本身只吃入库的
          # assets/dsh-frontend.tgz 与 ../shell-web（子模块不是输入），但显式
          # recursive 防后续步骤引用 mobile/dsh-mobile-nav 内容时静默失败
          #（旧仓 mobile job 没带 recursive，只因 tgz 入库才跑得通）。
          submodules: recursive

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          # expo-app 是 npm 项目（package-lock.json）；缓存用 npm 而非 pnpm——
          # pnpm 缓存要找 pnpm-lock.yaml，路径不存在会让 Post 步骤报
          # "Path Validation Error ... no cache is being saved"（旧仓 v0.6.4 实测）。
          cache: npm
          cache-dependency-path: mobile/expo-app/package-lock.json

      - name: Setup Java 17 (Android)
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          # RN/Expo 原生链（CMake + gradle）只支持 17-21；高版本 JDK 触发
          # "A restricted method in java.lang.System has been called" 失败
          #（本机 JDK 25 实测）。
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK (Android)
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          # 默认包含已从 Google SDK 仓库下架的 legacy 'tools' 包（sdkmanager 报
          # Failed to find package 'tools'，2026-09 起必失败）；显式只装 platform-tools。
          packages: 'platform-tools'

      - name: Install expo dependencies
        working-directory: mobile/expo-app
        run: npm ci

      - name: Expo prebuild (${{ matrix.target }})
        working-directory: mobile/expo-app
        run: npx expo prebuild -p ${{ matrix.target }} --no-install

      - name: Build Android APK
        if: matrix.target == 'android'
        working-directory: mobile/expo-app/android
        run: ./gradlew assembleDebug

      - name: Build iOS IPA (unsigned)
        if: matrix.target == 'ios'
        working-directory: mobile/expo-app/ios
        run: |
          pod --version
          pod install
          xcodebuild -workspace DeepSeek.xcworkspace \
            -scheme DeepSeek \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build-device \
            CODE_SIGNING_ALLOWED=NO \
            build
          mkdir -p /tmp/Payload
          cp -R build-device/Build/Products/Release-iphoneos/DeepSeek.app /tmp/Payload/
          cd /tmp && zip -qry DeepSeek.ipa Payload

      - name: Upload Android APK
        if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-android-apk
          path: mobile/expo-app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload iOS IPA
        if: matrix.target == 'ios'
        uses: actions/upload-artifact@v4
        with:
          name: dsh-mobile-ios-ipa
          path: /tmp/DeepSeek.ipa
          if-no-files-found: error